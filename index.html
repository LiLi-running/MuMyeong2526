<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무명의 유산</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="page">
      <div class="home">
        <section class="card">
          <div class="cal-head">
            <h2 id="cal-title"></h2>
            <div class="cal-nav">
              <button class="btn ghost sm" id="cal-prev" aria-label="이전 달">‹</button>
              <button class="btn ghost sm" id="cal-today">오늘</button>
              <button class="btn ghost sm" id="cal-next" aria-label="다음 달">›</button>
            </div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </section>

        <aside class="side-stack">
          <div class="card" id="auth-box"></div>
          <section class="card upcoming"><h2>다가오는 일정</h2><div id="upcoming" class="muted">불러오는 중…</div></section>
          <a class="card quick" id="link-twitter" target="_blank" rel="noopener">
            <div><b>트위터 바로가기</b></div>
            <span class="arrow">↗</span>
          </a>
          <a class="card quick" id="link-apply" target="_blank" rel="noopener">
            <div><b>신청서 양식</b><small>재성소 49회 졸업 신청서</small></div>
            <span class="arrow">↗</span>
          </a>
        </aside>
      </div>
    </main>
  </div>

  <script type="module" src="js/index.js"></script>
</body>
</html>
